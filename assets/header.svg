<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030806"/>
      <stop offset="60%" stop-color="#081711"/>
      <stop offset="100%" stop-color="#040c08"/>
    </linearGradient>
    
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="wave-grad-front" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6edf3"/>
    </linearGradient>

    <filter id="wave-glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card with Rounded Corners -->
  <clipPath id="card-clip">
    <rect width="1000" height="260" rx="16"/>
  </clipPath>

  <g clip-path="url(#card-clip)">
    <!-- Deep Space Cyber Dark Background -->
    <rect width="1000" height="260" fill="url(#bg-grad)"/>

    <!-- Subtle Tech Grid (Fades out near waves) -->
    <g opacity="0.06" stroke="#10b981" stroke-width="1">
      <line x1="125" y1="0" x2="125" y2="190"/>
      <line x1="250" y1="0" x2="250" y2="190"/>
      <line x1="375" y1="0" x2="375" y2="190"/>
      <line x1="500" y1="0" x2="500" y2="190"/>
      <line x1="625" y1="0" x2="625" y2="190"/>
      <line x1="750" y1="0" x2="750" y2="190"/>
      <line x1="875" y1="0" x2="875" y2="190"/>
      <line x1="0" y1="50" x2="1000" y2="50"/>
      <line x1="0" y1="100" x2="1000" y2="100"/>
      <line x1="0" y1="150" x2="1000" y2="150"/>
    </g>

    <!-- STATUS CHIP (Top Centered) -->
    <g transform="translate(500, 42)">
      <rect x="-115" y="-13" width="230" height="26" rx="13" fill="#041810" stroke="#10b981" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="-88" cy="0" r="3.5" fill="#10b981"/>
      <text x="-76" y="3.5" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">SYSTEM STATUS: ONLINE</text>
    </g>

    <!-- MAIN HEADLINE -->
    <text x="500" y="112" text-anchor="middle" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">ANMOL KUMAR</text>

    <!-- SUBTITLE -->
    <text x="500" y="152" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.03em">AUTONOMOUS AI SYSTEMS  •  FULL-STACK SYSTEMS  •  MOTION ARCHITECT</text>

    <!-- FLUID LAYER 1: Deep Back Wave -->
    <path d="M 0 195 C 200 165, 400 230, 620 185 C 800 150, 920 205, 1000 175 L 1000 260 L 0 260 Z" fill="url(#wave-grad-1)"/>

    <!-- FLUID LAYER 2: Middle Vibrant Wave -->
    <path d="M 0 215 C 220 240, 440 180, 680 215 C 840 240, 930 190, 1000 205 L 1000 260 L 0 260 Z" fill="url(#wave-grad-2)"/>

    <!-- FLUID LAYER 3: Foreground Waving Silhouette with Glowing Crest -->
    <path d="M 0 230 C 240 195, 480 245, 720 210 C 860 185, 940 220, 1000 200 L 1000 260 L 0 260 Z" fill="url(#wave-grad-front)"/>

    <!-- Glowing Crest Highlights -->
    <path d="M 0 230 C 240 195, 480 245, 720 210 C 860 185, 940 220, 1000 200" fill="none" stroke="#a7f3d0" stroke-width="2.5" filter="url(#wave-glow)"/>
    <path d="M 0 230 C 240 195, 480 245, 720 210 C 860 185, 940 220, 1000 200" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- Outer Border -->
  <rect width="1000" height="260" rx="16" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2"/>
</svg>
