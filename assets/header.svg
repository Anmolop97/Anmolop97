<svg width="1000" height="230" viewBox="0 0 1000 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040907"/>
      <stop offset="50%" stop-color="#091812"/>
      <stop offset="100%" stop-color="#040907"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1000" height="230" rx="14" fill="url(#bg-grad)"/>
  <rect width="1000" height="230" rx="14" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Subtle Cyber Matrix Grid Background -->
  <g opacity="0.05" stroke="#10b981" stroke-width="1">
    <line x1="125" y1="0" x2="125" y2="230"/>
    <line x1="250" y1="0" x2="250" y2="230"/>
    <line x1="375" y1="0" x2="375" y2="230"/>
    <line x1="500" y1="0" x2="500" y2="230"/>
    <line x1="625" y1="0" x2="625" y2="230"/>
    <line x1="750" y1="0" x2="750" y2="230"/>
    <line x1="875" y1="0" x2="875" y2="230"/>
    <line x1="0" y1="60" x2="1000" y2="60"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="180" x2="1000" y2="180"/>
  </g>

  <!-- Status Chip (Top) -->
  <g transform="translate(500, 40)">
    <rect x="-115" y="-13" width="230" height="26" rx="13" fill="#04140d" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="-88" cy="0" r="3.5" fill="#10b981"/>
    <text x="-76" y="3.5" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">SYSTEM STATUS: ONLINE</text>
  </g>

  <!-- Main Title (Middle) -->
  <text x="500" y="105" text-anchor="middle" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.02em">ANMOL KUMAR</text>

  <!-- Subtitle (Clear of any waves) -->
  <text x="500" y="145" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.03em">AUTONOMOUS AI SYSTEMS  •  FULL-STACK SYSTEMS  •  MOTION ARCHITECT</text>

  <!-- Glowing Cyber Waves (Pushed to bottom edge so they NEVER overlap text) -->
  <path d="M0 205 C 250 185, 450 220, 700 195 C 850 180, 950 205, 1000 190" fill="none" stroke="url(#emerald-glow)" stroke-width="3" filter="url(#glow)"/>
  <path d="M0 205 C 250 185, 450 220, 700 195 C 850 180, 950 205, 1000 190" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <path d="M0 218 C 300 205, 520 225, 780 212 C 880 205, 940 215, 1000 210" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4"/>
</svg>
